# VeriThreat · ioc-service. La base de datos es la de docker-compose.yml (esquema verithreat), compartida con el motor
# Python de ai/ (decisión 14 de CLAUDE.md). La contraseña se toma de PGPASSWORD o de POSTGRES_PASSWORD (.env del repo).
spring:
  application:
    name: ioc-service
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://${PGHOST:127.0.0.1}:${PGPORT:5433}/${PGDATABASE:verithreat}?currentSchema=verithreat
    username: ${PGUSER:verithreat}
    password: ${PGPASSWORD:${POSTGRES_PASSWORD:}}
  mvc:
    problemdetails:
      enabled: true

server:
  address: 127.0.0.1   # solo accesible desde este equipo; el Gateway (subpaso b) será la puerta de entrada
  port: 8081

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

verithreat:
  # Cabecera con la organización que llama. En el subpaso (b) la pondrá el Gateway tras validar la clave de API y
  # el servicio dejará de ser accesible directamente.
  organization-header: X-Organization
  # Secreto compartido con el Gateway (GATEWAY_TOKEN en .env): sin él, /api/** devuelve 401. Vacío = no se exige
  # (solo para desarrollo; el servicio lo avisa al arrancar).
  gateway-token: ${GATEWAY_TOKEN:}
  # Registro en Fabric de las aportaciones (paso 6d; red de blockchain/network.sh). Con enabled = false las
  # aportaciones se quedan 'pending' en la tabla fabric_registration y se envían al activarlo.
  fabric:
    enabled: ${FABRIC_ENABLED:true}
    channel: iocchannel
    chaincode: iocregistry
    poll-interval: 5s
    batch-size: 20
    retry-base: 10s
    retry-max: 30m
    # test-network de fabric-samples (en WSL; se recrea con certificados nuevos en cada `network.sh up`)
    test-network: ${FABRIC_TEST_NETWORK:${user.home}/fabric/fabric-samples/test-network}
    # Simplificación del TFM: el servicio firma con la identidad User1 de cada organización (ver FabricProperties)
    organizations:
      org-alpha:
        msp-id: Org1MSP
        certificate: ${verithreat.fabric.test-network}/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/User1@org1.example.com-cert.pem
        private-key: ${verithreat.fabric.test-network}/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore
        peer-endpoint: localhost:7051
        peer-host-override: peer0.org1.example.com
        tls-ca-certificate: ${verithreat.fabric.test-network}/organizations/peerOrganizations/org1.example.com/tlsca/tlsca.org1.example.com-cert.pem
      org-beta:
        msp-id: Org2MSP
        certificate: ${verithreat.fabric.test-network}/organizations/peerOrganizations/org2.example.com/users/User1@org2.example.com/msp/signcerts/User1@org2.example.com-cert.pem
        private-key: ${verithreat.fabric.test-network}/organizations/peerOrganizations/org2.example.com/users/User1@org2.example.com/msp/keystore
        peer-endpoint: localhost:9051
        peer-host-override: peer0.org2.example.com
        tls-ca-certificate: ${verithreat.fabric.test-network}/organizations/peerOrganizations/org2.example.com/tlsca/tlsca.org2.example.com-cert.pem
